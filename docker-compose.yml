services:
  # Vector database — thay thế ChromaDB.
  # Dashboard: http://localhost:6333/dashboard
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: agentrag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API + dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Streamlit UI + RAG harness. LLM vẫn chạy trên OpenAI API.
  app:
    build: .
    container_name: agentrag-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Trong mạng Docker nội bộ, app gọi Qdrant bằng tên service.
      # Ghi đè QDRANT_URL trong .env (vốn là localhost cho chạy không Docker).
      QDRANT_URL: http://qdrant:6333
    volumes:
      # Knowledge là file trên máy host: sửa file ngoài này là app thấy ngay.
      - ./data:/app/data
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
